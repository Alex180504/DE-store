# Application Configuration
spring.application.name=shopping-mock-service
server.port=8090

# Logging Configuration
logging.level.com.destore.shopping=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# External Service URLs
loyalty.service.url=http://loyalty-service:8080
warehouse.service.url=http://warehouse-db:3306
pricing.service.url=http://pricing-service:8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Mock Data Configuration
mock.customer.default-id=1
mock.store.default-id=1

