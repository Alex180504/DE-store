services:
  # Legacy Warehouse Database (MySQL)
  warehouse-db:
    image: mysql:8.0
    container_name: de-store-warehouse-db
    environment:
      MYSQL_ROOT_PASSWORD: warehouse_root_pass
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse_user
      MYSQL_PASSWORD: warehouse_pass
    ports:
      - "3306:3306"
    volumes:
      - ./warehouse-db/init:/docker-entrypoint-initdb.d
      - warehouse-data:/var/lib/mysql
    networks:
      - de-store-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pricing Database (PostgreSQL)
  pricing-db:
    image: postgres:15
    container_name: de-store-pricing-db
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing_user
      POSTGRES_PASSWORD: pricing_pass
    ports:
      - "5432:5432"
    volumes:
      - ./pricing-service/db/init:/docker-entrypoint-initdb.d
      - pricing-data:/var/lib/postgresql/data
    networks:
      - de-store-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing_user -d pricing"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentication Database (PostgreSQL)
  auth-db:
    image: postgres:15
    container_name: de-store-auth-db
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    volumes:
      - ./auth-service/db/init:/docker-entrypoint-initdb.d
      - auth-data:/var/lib/postgresql/data
    networks:
      - de-store-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Store Database (PostgreSQL)
  store-db:
    image: postgres:15
    container_name: de-store-store-db
    environment:
      POSTGRES_DB: stores
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: store_pass
    ports:
      - "5434:5432"
    volumes:
      - ./store-service/db/init:/docker-entrypoint-initdb.d
      - store-data:/var/lib/postgresql/data
    networks:
      - de-store-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_user -d stores"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pricing Service (Spring Boot)
  pricing-service:
    build:
      context: ./pricing-service
      dockerfile: Dockerfile
    container_name: de-store-pricing-service
    environment:
      # Pricing DB Connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://pricing-db:5432/pricing
      SPRING_DATASOURCE_USERNAME: pricing_user
      SPRING_DATASOURCE_PASSWORD: pricing_pass
      # Warehouse DB Connection (Read-Only)
      WAREHOUSE_DATASOURCE_URL: jdbc:mysql://warehouse-db:3306/warehouse
      WAREHOUSE_DATASOURCE_USERNAME: warehouse_user
      WAREHOUSE_DATASOURCE_PASSWORD: warehouse_pass
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      # Application Settings
      SERVER_PORT: 8080
      LOGGING_LEVEL_COM_DESTORE: DEBUG
      # JWT Configuration (must match auth-service)
      JWT_SECRET: DEStoreSecretKeyForJWTAuthentication2025ChangeInProduction
      JWT_EXPIRATION: "86400000"
    expose:
      - "8080"
    depends_on:
      pricing-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
    networks:
      - de-store-network
    restart: unless-stopped

  # Authentication Service (Spring Boot)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: de-store-auth-service
    environment:
      # Auth DB Connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      # JWT Configuration
      JWT_SECRET: DEStoreSecretKeyForJWTAuthentication2025ChangeInProduction
      JWT_EXPIRATION: 86400000
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      # Application Settings
      SERVER_PORT: 8081
      LOGGING_LEVEL_COM_DESTORE: DEBUG
    expose:
      - "8081"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - de-store-network
    restart: unless-stopped

  # Store Service (Spring Boot)
  store-service:
    build:
      context: ./store-service
      dockerfile: Dockerfile
    container_name: de-store-store-service
    environment:
      # Store DB Connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://store-db:5432/stores
      SPRING_DATASOURCE_USERNAME: store_user
      SPRING_DATASOURCE_PASSWORD: store_pass
      # JWT Configuration (must match auth-service)
      JWT_SECRET: DEStoreSecretKeyForJWTAuthentication2025ChangeInProduction
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      # Application Settings
      SERVER_PORT: 8083
      LOGGING_LEVEL_COM_DESTORE: DEBUG
    expose:
      - "8083"
    depends_on:
      store-db:
        condition: service_healthy
    networks:
      - de-store-network
    restart: unless-stopped

  # API Gateway (Nginx)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: de-store-api-gateway
    ports:
      - "80:80"
    depends_on:
      - pricing-service
      - auth-service
      - store-service
    networks:
      - de-store-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Management UI (Nginx + Static Files)
  ui-service:
    build:
      context: ./ui-service
      dockerfile: Dockerfile
    container_name: de-store-ui-service
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - de-store-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3

  # MailHog (SMTP Server for Development)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: de-store-mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - de-store-network
    restart: unless-stopped

  # Inventory Service (Spring Boot)
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: de-store-inventory-service
    environment:
      # Primary Datasource - Warehouse DB (MySQL, Read-Only)
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:mysql://warehouse-db:3306/warehouse
      SPRING_DATASOURCE_PRIMARY_USERNAME: warehouse_user
      SPRING_DATASOURCE_PRIMARY_PASSWORD: warehouse_pass
      SPRING_DATASOURCE_PRIMARY_DRIVER: com.mysql.cj.jdbc.Driver
      # Secondary Datasource - Auth DB (PostgreSQL, Read-Only for emails)
      SPRING_DATASOURCE_AUTH_URL: jdbc:postgresql://auth-db:5432/auth
      SPRING_DATASOURCE_AUTH_USERNAME: auth_user
      SPRING_DATASOURCE_AUTH_PASSWORD: auth_pass
      SPRING_DATASOURCE_AUTH_DRIVER: org.postgresql.Driver
      # Mail Configuration
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      EMAIL_FROM: inventory@de-store.com
      EMAIL_SUBJECT_PREFIX: "[DE-Store Alert]"
      EMAIL_ENABLED: "true"
      # Inventory Thresholds
      INVENTORY_THRESHOLDS_LOW_STOCK: 50
      INVENTORY_THRESHOLDS_CRITICAL_STOCK: 20
      INVENTORY_THRESHOLDS_OUT_OF_STOCK: 0
      # Schedule (every 6 hours: 0 0 */6 * * ?)
      INVENTORY_SCHEDULE: "0 0 */6 * * ?"
      # JWT Configuration (must match auth-service)
      JWT_SECRET: DEStoreSecretKeyForJWTAuthentication2025ChangeInProduction
      JWT_EXPIRATION: "86400000"
      # JPA Configuration
      SPRING_JPA_SHOW_SQL: "true"
      # Application Settings
      SERVER_PORT: 8084
      LOGGING_LEVEL_COM_DESTORE: DEBUG
    ports:
      - "8084:8084"
    depends_on:
      warehouse-db:
        condition: service_healthy
      auth-db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - de-store-network
    restart: unless-stopped

  # ============================================================
  # TEST SERVICES (use --profile test to enable)
  # Usage: docker-compose --profile test up test-all
  # ============================================================
  
  test-auth:
    profiles: ["test"]
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: build
    container_name: de-store-test-auth
    command: mvn test
    volumes:
      - ./auth-service:/app
      - maven-cache:/root/.m2
    networks:
      - de-store-network
    depends_on:
      auth-db:
        condition: service_healthy

  test-pricing:
    profiles: ["test"]
    build:
      context: ./pricing-service
      dockerfile: Dockerfile
      target: build
    container_name: de-store-test-pricing
    command: mvn test
    volumes:
      - ./pricing-service:/app
      - maven-cache:/root/.m2
    networks:
      - de-store-network
    depends_on:
      pricing-db:
        condition: service_healthy

  test-store:
    profiles: ["test"]
    build:
      context: ./store-service
      dockerfile: Dockerfile
      target: build
    container_name: de-store-test-store
    command: mvn test
    volumes:
      - ./store-service:/app
      - maven-cache:/root/.m2
    networks:
      - de-store-network
    depends_on:
      store-db:
        condition: service_healthy

  test-inventory:
    profiles: ["test"]
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
      target: build
    container_name: de-store-test-inventory
    command: mvn test
    volumes:
      - ./inventory-service:/app
      - maven-cache:/root/.m2
    networks:
      - de-store-network
    depends_on:
      warehouse-db:
        condition: service_healthy
      auth-db:
        condition: service_healthy

networks:
  de-store-network:
    driver: bridge
    name: de-store-network

volumes:
  warehouse-data:
    name: de-store-warehouse-data
  pricing-data:
    name: de-store-pricing-data
  auth-data:
    name: de-store-auth-data
  store-data:
    name: de-store-store-data
  maven-cache:
    name: de-store-maven-cache
