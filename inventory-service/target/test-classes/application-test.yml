spring:
  datasource:
    warehouse:
      url: jdbc:h2:mem:warehouse_test
      driver-class-name: org.h2.Driver
      username: sa
      password: 
    auth:
      url: jdbc:h2:mem:auth_test
      driver-class-name: org.h2.Driver
      username: sa
      password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 1025
    username: test
    password: test

# JWT Configuration for tests
jwt:
  secret: test-secret-key-for-integration-tests-minimum-256-bits-required
  expiration: 3600000

# Inventory thresholds for tests
inventory:
  thresholds:
    low-stock: 50
    critical-stock: 20
    out-of-stock: 0
  email:
    from: test@destore.com
    to: networkmanager@destore.com
  schedule:
    enabled: false  # Disable scheduled tasks during tests
