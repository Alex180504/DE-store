# Application Configuration
spring.application.name=loyalty-service
server.port=8080

# Loyalty Database Configuration (Primary - Read/Write)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/loyalty}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:loyalty_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:loyalty_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Accounting Database Configuration (Secondary - Read-Only)
spring.datasource.accounting.url=${SPRING_DATASOURCE_ACCOUNTING_URL:jdbc:postgresql://localhost:5435/accounting}
spring.datasource.accounting.username=${SPRING_DATASOURCE_ACCOUNTING_USERNAME:accounting_user}
spring.datasource.accounting.password=${SPRING_DATASOURCE_ACCOUNTING_PASSWORD:accounting_pass}
spring.datasource.accounting.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging Configuration
logging.level.com.destore.loyalty=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration (must match auth-service)
jwt.secret=DEStoreSecretKeyForJWTAuthentication2025ChangeInProduction
jwt.expiration=86400000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Scheduled Tasks Configuration
loyalty.scheduler.enabled=true
loyalty.scheduler.points-calculation-cron=0 0 */6 * * *
loyalty.scheduler.batch-size=100

# Points Calculation Configuration
loyalty.points.default-points-per-gbp=1.0
loyalty.points.rounding-mode=HALF_UP

# Redemption Configuration
loyalty.redemption.max-concurrent-attempts=3
loyalty.redemption.lock-timeout-seconds=30

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
