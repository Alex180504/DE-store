    # Auth service placeholder (future implementation)
    # location /auth/validate {
    #     internal;
    #     proxy_pass http://auth-service:8081/validate;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header X-Original-URI $request_uri;
    # }

    # Default location - return 404
    location / {
        return 404 '{"error": "Not Found", "message": "Invalid API endpoint"}';
        add_header Content-Type application/json;
    }

    # Error pages
    error_page 404 /404.json;
    location = /404.json {
        internal;
        return 404 '{"error": "Not Found", "message": "The requested resource was not found"}';
        add_header Content-Type application/json;
    }

    error_page 500 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        return 500 '{"error": "Server Error", "message": "An internal server error occurred"}';
        add_header Content-Type application/json;
    }

    error_page 429 /429.json;
    location = /429.json {
        internal;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please try again later."}';
        add_header Content-Type application/json;
    }
}
