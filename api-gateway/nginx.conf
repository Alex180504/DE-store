# DE-Store API Gateway Configuration
# This Nginx configuration serves as the central API gateway for the DE-Store system
# It handles routing, CORS, rate limiting, and will integrate JWT authentication

# Rate limiting zones
# Limit pricing API calls to prevent abuse
limit_req_zone $binary_remote_addr zone=pricing_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=300r/m;

# CORS origin mapping
map $http_origin $cors_origin {
    default "";
    "~^http://localhost:3000$" $http_origin;
    "~^http://ui-service:3000$" $http_origin;
}

# Upstream service definitions
upstream pricing_service {
    server pricing-service:8080;
    keepalive 32;
}

upstream auth_service {
    server auth-service:8081;
    keepalive 32;
}

upstream store_service {
    server store-service:8083;
    keepalive 32;
}

upstream loyalty_service {
    server loyalty-service:8085;
    keepalive 32;
}

upstream analytics_service {
    server analytics-service:8086;
    keepalive 32;
}

upstream finance_adapter {
    server finance-adapter:8091;
    keepalive 32;
}

# Main server block
server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check endpoint (bypass authentication)
    location /health {
        access_log off;
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }

    # Authentication Service API routes (public - no auth required)
    location /api/auth/ {
        # Apply rate limiting
        limit_req zone=general_limit burst=10 nodelay;
        limit_req_status 429;

        # Handle CORS preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' '1728000' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Max-Age' '1728000' always;

        # Proxy configuration
        proxy_pass http://auth_service;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Pricing Service API routes
    location /api/pricing/ {
        # Apply rate limiting
        limit_req zone=pricing_limit burst=20 nodelay;
        limit_req_status 429;

        # Handle CORS preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' '1728000' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Max-Age' '1728000' always;

        # JWT authentication placeholder
        # TODO: Integrate with auth service when implemented
        # auth_request /auth/validate;
        # auth_request_set $user_id $upstream_http_x_user_id;
        # proxy_set_header X-User-ID $user_id;

        # Proxy configuration
        proxy_pass http://pricing_service;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Store Service API routes (requires authentication)
    location /api/stores/ {
