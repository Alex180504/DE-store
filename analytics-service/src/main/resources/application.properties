spring.application.name=analytics-service
server.port=8086

# Multi-Datasource Configuration

# Accounting Database (Read-Only - Primary data source)
spring.datasource.accounting.jdbc-url=${SPRING_DATASOURCE_ACCOUNTING_URL:jdbc:postgresql://localhost:5435/accounting}
spring.datasource.accounting.username=${SPRING_DATASOURCE_ACCOUNTING_USERNAME:accounting_user}
spring.datasource.accounting.password=${SPRING_DATASOURCE_ACCOUNTING_PASSWORD:accounting_pass}
spring.datasource.accounting.driver-class-name=org.postgresql.Driver
spring.datasource.accounting.hikari.maximum-pool-size=10
spring.datasource.accounting.hikari.minimum-idle=2
spring.datasource.accounting.hikari.connection-timeout=30000
spring.datasource.accounting.hikari.read-only=true

# Store Database (Read-Only - Store metadata)
spring.datasource.store.jdbc-url=${SPRING_DATASOURCE_STORE_URL:jdbc:postgresql://localhost:5434/stores}
spring.datasource.store.username=${SPRING_DATASOURCE_STORE_USERNAME:store_user}
spring.datasource.store.password=${SPRING_DATASOURCE_STORE_PASSWORD:store_pass}
spring.datasource.store.driver-class-name=org.postgresql.Driver
spring.datasource.store.hikari.maximum-pool-size=5
spring.datasource.store.hikari.minimum-idle=1
spring.datasource.store.hikari.connection-timeout=30000
spring.datasource.store.hikari.read-only=true

# Warehouse Database (Read-Only - Product metadata)
spring.datasource.warehouse.jdbc-url=${SPRING_DATASOURCE_WAREHOUSE_URL:jdbc:mysql://localhost:3306/warehouse}
spring.datasource.warehouse.username=${SPRING_DATASOURCE_WAREHOUSE_USERNAME:warehouse_user}
spring.datasource.warehouse.password=${SPRING_DATASOURCE_WAREHOUSE_PASSWORD:warehouse_pass}
spring.datasource.warehouse.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.warehouse.hikari.maximum-pool-size=5
spring.datasource.warehouse.hikari.minimum-idle=1
spring.datasource.warehouse.hikari.connection-timeout=30000
spring.datasource.warehouse.hikari.read-only=true

# JWT Configuration (must match auth-service)
jwt.secret=${JWT_SECRET:DEStoreSecretKeyForJWTAuthentication2025ChangeInProduction}

# Logging
logging.level.root=INFO
logging.level.com.destore=${LOGGING_LEVEL_COM_DESTORE:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# API Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
